apiVersion: v1
kind: Service
metadata:
  name: project4-service
  namespace: project4
spec:
  type: LoadBalancer
  selector:
    app: project4
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: project4
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
